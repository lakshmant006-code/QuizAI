<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizAI</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="/_ds_bundle.js"></script>
<style>body{margin:0;background:#fff}#root{min-height:100vh}</style>
<style>
/* ===== QuizAI responsive (iPad + phone) — overrides inline styles ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
#root img,#root video,#root canvas,#root svg{max-width:100%}

/* ---------- iPad / tablet: <=1024px ---------- */
@media (max-width:1024px){
  #root [style*="grid-template-columns: repeat(4"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  #root [style*="grid-template-columns: repeat(3"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  #root aside[style*="width: 210px"]{width:184px!important}
  #root [style*="padding: 96px 40px 110px"]{padding:80px 28px 90px!important}
  #root h1[data-hero]{font-size:44px!important}
}

/* ---------- Phone: <=640px ---------- */
@media (max-width:640px){
  /* App shell: stack sidebar above main */
  #root [style*="display: flex"][style*="border-radius: 20px"][style*="overflow: hidden"]{flex-direction:column!important;min-height:0!important}
  #root aside[style*="width: 210px"]{width:100%!important;border-right:none!important;border-bottom:1px solid rgba(0,0,0,0.07)!important}
  #root [style*="min-height: 100vh"][style*="padding: 24px"]{padding:10px!important}
  #root main[style*="padding: 36px 40px 44px"]{padding:20px 16px 28px!important}

  /* Every multi-column grid collapses to one column */
  #root [style*="grid-template-columns"]{grid-template-columns:1fr!important}

  /* Landing nav */
  #root nav[style*="padding: 18px 40px"]{padding:12px 16px!important}
  #root nav [style*="gap: 28px"]{gap:12px!important}
  #root nav a[href="#features"],#root nav a[href="#how"]{display:none!important}

  /* Landing hero */
  #root [style*="padding: 96px 40px 110px"]{padding:48px 16px 56px!important}
  #root h1[data-hero]{font-size:31px!important;letter-spacing:-0.5px!important}
  #root p[data-hero]{font-size:16px!important}

  /* Horizontal card rows (features, how-it-works) stack */
  #root [style*="display: flex"][style*="gap: 20px"]{flex-wrap:wrap!important}
  #root [style*="display: flex"][style*="gap: 20px"]>*{flex:1 1 100%!important}

  /* Section side padding */
  #root [style*="padding: 0px 40px 90px"]{padding-left:16px!important;padding-right:16px!important}
  #root [style*="padding: 70px 40px"]{padding-left:16px!important;padding-right:16px!important}
  #root [style*="padding: 90px 40px"]{padding-left:16px!important;padding-right:16px!important}
  #root footer[style*="padding: 24px 40px"]{padding:20px 16px!important}

  /* Fixed-width buttons / login card fit the viewport */
  #root [style*="width: 380px"]{width:100%!important;max-width:380px!important}
  #root [data-hero][style*="gap: 12px"]{flex-direction:column!important;align-items:stretch!important;width:100%!important;max-width:340px!important}
  #root [style*="width: 190px"],#root [style*="width: 170px"],#root [style*="width: 220px"]{width:100%!important;max-width:340px!important}
}
</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="/templates/quizai-landing/Landing.jsx"></script>
<script type="text/babel" data-presets="react">const el=document.getElementById("root");if(el)ReactDOM.createRoot(el).render(React.createElement(window.QuizAiLanding));</script>
</body></html>
