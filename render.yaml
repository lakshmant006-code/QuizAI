# Render Blueprint — auto-configures the QuizAI web service.
# In Render: New + → Blueprint → connect this repo → Apply.
# Then fill in the two values marked "sync: false" in the dashboard.
services:
  - type: web
    name: quizai
    runtime: node
    plan: free
    rootDir: quizai            # the Next.js app lives in this subfolder
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true           # redeploy on every push to the default branch
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Supabase publishable values (safe to commit — protected by RLS):
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://czgzfqjfjfxrwlxostnj.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable_p2lsbeZvy2r74kK6bx86Cw_NRUxeqsD
      # Secret — enter in the Render dashboard, never committed:
      - key: ANTHROPIC_API_KEY
        sync: false
      # Set to your Render URL after the first deploy (e.g. https://quizai.onrender.com):
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # URL of the offline quiz-engine service (e.g. https://quiz-engine-xxxx.onrender.com):
      - key: QUIZ_ENGINE_URL
        sync: false
      # Google Analytics 4 Measurement ID (e.g. G-XXXXXXXXXX):
      - key: NEXT_PUBLIC_GA_ID
        sync: false
      # Google Search Console verification token (content of the meta tag):
      - key: NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
        sync: false

  # Offline quiz engine (Python FastAPI, no LLM / no tokens).
  - type: web
    name: quiz-engine
    runtime: python
    plan: free
    rootDir: quiz-engine
    # en_core_web_md ships word vectors → semantic distractors. (~40 MB)
    # Swap full opencv (needs libGL) for headless so RapidOCR runs on the
    # native runtime without system packages.
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_md && pip uninstall -y opencv-python && pip install opencv-python-headless==4.10.0.84
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_ORIGINS
        value: "*"
