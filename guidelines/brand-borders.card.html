<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-sans);display:flex;gap:14px}.c{flex:1;height:90px;border-radius:14px;padding:12px;font-size:12px;color:var(--asu-maroon)}</style></head>
<body>
<div class="c" style="background:var(--surface-maroon-tint);border:1px solid var(--border-maroon-tint)">Border-only (used)</div>
<div class="c" style="background:#fff;box-shadow:var(--shadow-elevated)">Drop-shadow (not preferred per ASU brand guide; menus/overlays only)</div>
</body></html>
